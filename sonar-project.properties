# ─────────────────────────────────────────────────────────────
# SonarCloud / SonarQube project configuration
#
# To activate: sonarcloud.io → Log in with GitHub → import this
# repo → copy the projectKey and organization values shown and
# paste them below, then add SONAR_TOKEN to repo secrets.
# ─────────────────────────────────────────────────────────────

# Update these two values from sonarcloud.io after importing the repo
sonar.projectKey=Joesmithessang_stridelux-backend
sonar.organization=joeyvulnapp

sonar.projectName=StrideLux Backend
sonar.projectVersion=1.0

# Analyse Lambda source only — exclude installed dependencies and lock files
sonar.sources=lambdas
sonar.exclusions=**/node_modules/**,**/package-lock.json,**/*.test.js

# If you add Jest coverage reporting later, point to the lcov output
# sonar.javascript.lcov.reportPaths=coverage/lcov.info
